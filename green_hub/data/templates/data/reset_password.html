{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Login - FreshCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'data/css/style.css'%}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body class="login-page">

    <div class="container my-5 py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                <div class="text-center mb-4" >
                    <h3 class="fw-bold text-primary">Welcome to Green Hub</h3>
                </div>
                <div class="card p-4 border border-light shadow-sm bg-white" >
                    {%if e_msg %}
                    <div class="alert alert-danger" role="alert">
                        {{e_msg}}
                    </div>
                    {% endif %}
                    <h5 class="fw-bold mb-3 text-dark" align="center">Reset Password</h5>
                    <form action="{% url 'data:reset-password' %}" method="post">
                        {% csrf_token %}
                        <!-- <div class="mb-3">
                            <label class="form-label small fw-semibold">Email Address</label>
                            <input type="email" class="form-control" required placeholder="name@example.com" name="email">
                        </div> -->
                         <input type="hidden" class="form-control" required placeholder="name@example.com" name="email" value="{{email}}">
                        <input
                            type="hidden"
                            name="email"
                            value="{{ email }}">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">New Password</label>
                            <input type="password" class="form-control" required placeholder="enter new password " name="newpassword">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Confirm Password</label>
                            <input type="password" class="form-control" required placeholder="enter confirm password" name="repassword">
                        </div>
                        <input type="submit" class="btn btn-primary w-100 py-2 mt-2" value="Reset Password">
                    </form>
                    <div class="text-center mt-3 small">
                        <span class="text-muted">Click here for </span> <a href="{% url 'data:login' %}" class="text-primary text-decoration-none fw-medium">Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
