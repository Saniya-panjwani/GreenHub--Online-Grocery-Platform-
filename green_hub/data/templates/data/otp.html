{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Login - FreshCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'data/css/style.css'%}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body class="login-page">

    <div class="container my-5 py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                <div class="text-center mb-4" >
                    <h3 class="fw-bold text-primary">Welcome to Green Hub</h3>
                </div>
                <div class="card p-4 border border-light shadow-sm bg-white" >
                    {% if e_msg %}
                    <div class="alert alert-danger" role="alert">
                        {{e_msg}}
                    </div>
                    {% endif %}
                    <h5 class="fw-bold mb-3 text-dark" align="center">OTP Verification</h5>
                    <form action="{% url 'data:otp-view' %}" method="post">
                        {% csrf_token %}
                         <input type="hidden" class="form-control" required placeholder="enter otp" name="email" value="{{email}}">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">OTP</label>
                            <input type="text" class="form-control" required placeholder="enter otp" name="otp">
                        </div>
                        <input type="submit" class="btn btn-primary w-100 py-2 mt-2" id="btncheck" value="Check">
                    </form>
                    <div class="text-center mt-3 small">
                        <span class="text-muted">Click here for </span> <a href="{% url 'data:login' %}" class="text-primary text-decoration-none fw-medium">Login</a>
                    </div>
                    <div class="text-center mt-3 small">
                        Timer :
                        <span id="timer_sec"><span id="timer">
                          30  
                        </span> sec</span>
                    </div>
                    <div class="text-center mt-3 small" id="resendotp" style="display: none;">
                        <span class="text-muted">
                            Click here for 
                        </span> 
                        <a href="#" class="text-primary text-decoration-none fw-medium" id="resendotp_click" style="color: teal;">
                            Resend OTP
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

<script>
    let trial = 1;
    let time = 30;
    let timerElement = document.getElementById("timer");
    let timerSecElement = document.getElementById("timer_sec");
    let btncheck = document.getElementById("btncheck");
    let resendotp = document.getElementById("resendotp");
    let resendotp_click = document.getElementById("resendotp_click");


    function startTimer()
    {
        let timerInterval = setInterval(() => {
        if (time<=5){
        timerElement.style.color = "red";
        }
        if(time<0){
            clearInterval(timerInterval);
            timerSecElement.innerHTML = "OTP Expired !"
            btncheck.style.opacity = "0.3"
            btncheck.disabled = true;

                if(trial == 1)
                {
                    resendotp.style.display="block"
                }
        }
        else{
            timerElement.innerHTML = time + " ";
            time--;
        }
    }, 1000);
   
    }

    startTimer();

    resendotp_click.addEventListener("click",()=>{
        time = 30;
        trial = 2; 

        timerSecElement.innerHTML = 'Timer : <span id = "timer">30</span> sec';
        timerElement = document.getElementById("timer");

        btncheck.disabled=false;
        btncheck.style.opacity = "1";

        resendotp.style.display = "none";
        startTimer()
    })
</script>

</html>
