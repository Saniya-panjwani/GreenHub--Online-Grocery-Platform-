{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Profile - FreshCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'data/css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="register-page">

    <div class="container my-5 py-4">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card p-4 border border-light shadow-sm bg-white">
                    {%if e_msg %}
                    <div class="alert alert-danger" role="alert">
                        {{e_msg}}
                    </div>
                    {% endif %}
                    <h5 class="fw-bold mb-3 text-dark" align="center">Create Account</h5>
                    
                    <form action="{% url 'data:register' %}" method="post">
                        {% csrf_token %} <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label small fw-semibold" for="userRole">Register As</label>
                                <select class="form-select" id="userRole" name="role" required>
                                    <option value="" disabled selected>Choose your role...</option>
                                    <option value="customer">Customer</option>
                                    <option value="shopkeeper">Shopkeeper</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">First Name</label>
                                <input type="text" name="first_name" class="form-control" required placeholder="Jane">
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Last Name</label>
                                <input type="text" name="last_name" class="form-control" required placeholder="Doe">
                            </div>
                            
                            <div class="col-12">
                                <label class="form-label small fw-semibold">Email Address</label>
                                <input type="email" name="email" class="form-control" required placeholder="jane.doe@example.com">
                            </div>
                            
                            <div class="col-12">
                                <label class="form-label small fw-semibold">Create Secure Password</label>
                                <input type="password" name="password" class="form-control" required placeholder="••••••••">
                            </div>

                            <div class="col-12">
                                <label class="form-label small fw-semibold">Confirm Password</label>
                                <input type="password" name="confirm_password" class="form-control" required placeholder="••••••••">
                            </div>
                        </div>
                        
                        <input type="submit" class="btn btn-primary w-100 py-2 mt-4" value="Create Account">
                    </form>
                    
                    <div class="text-center mt-3 small">
                        <span class="text-muted">Already registered?</span> <a href="{% url 'data:login' %}" class="text-primary text-decoration-none fw-medium">Login instead</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
