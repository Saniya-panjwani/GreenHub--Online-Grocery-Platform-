{% extends 'shopkeeper/seller-dashboard.html' %}

{% block content %}

<div class="edit-product-wrapper">

<div class="page-header">

    <div>

        <h2>Edit product</h2>

        <p>Edit Your Product.</p>

    </div>

    <i class="bi bi-box-seam header-icon"></i>

</div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="add-product-title">Edit Product</h1>
            <p class="add-product-subtitle mb-0">
                Edit and publish products to your store
            </p>
        </div>

        <span class="badge bg-success px-3 py-2">
            New Listing
        </span>
    </div>

    <form action="{% url 'shopkeeper:update-product' %}" method="post" enctype="multipart/form-data">
                {% csrf_token %}

    <div class="row g-4 align-items-start">

        <!-- Left Side -->
        <div class="col-lg-4">

            <div class="upload-card">

                <h5 class="mb-3">

                    <i class="bi bi-image me-2"></i>
                        Product Image

                </h5>

                <img src="https://placehold.co/500x350"
                     class="img-fluid rounded-4 mb-3"
                     alt="Product">

                <label class="form-label">
                    Upload Image
                </label>

                <input type="file" class="form-control" name="images">

            </div>

        </div>

        <!-- Right Side -->
        <div class="col-lg-8">
            <div class="product-hero mb-4">
                <div>
                    <h2>Add New Product</h2>
                    <p>Manage your inventory and grow your store faster.</p>
                </div>
                <i class="bi bi-box-seam-fill hero-icon"></i>
            </div>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Product Name</label>
                        <input type="hidden"
                               class="form-control"
                               name="id"
                               value="{{product.id}}">
                        <input type="text"
                               class="form-control"
                               placeholder="Enter product name"
                               name="product_name"
                               value="{{product.product_name}}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">SKU</label>
                        <input type="text"
                               class="form-control"
                               placeholder="SKU-001"
                               name="sku"
                               value="{{product.sku}}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Category</label>
                        <select class="form-select" name="category">
                            {% for category in categories %}
                            <option value="{{category.id}}">{{category.category_name}}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
    <label class="form-label">Base Price</label>
    <input type="number"
           class="form-control"
           placeholder="₹100"
           name="base_price"
           value="{{product.base_price}}">
</div>

<div class="col-md-6">
    <label class="form-label">Discount Price</label>
    <input type="number"
           class="form-control"
           placeholder="₹80"
           name="discount_price"
           value="{{product.discount_price}}">
</div>
                    

                    <div class="col-md-6">
                        <label class="form-label">Stock Quantity</label>
                        <input type="number"
                               class="form-control"
                               placeholder="50"
                               name="stock_qty" value="{{product.stock_qty}}">
                    </div> 

                    <div class="col-md-6">
                        <label class="form-label">Unit</label>
                        <select class="form-select" name="unit">
                            {% for value,label in unit_choice %}
                            <option value="{{value}}">{{label}}</option>
                            {% endfor %}
                        </select>
                    </div> 
                    

                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea class="form-control"
                                  rows="4"
                                  placeholder="Write product description"
                                  name="description"
                                  >{{product.description}}</textarea>
                    </div>

                </div>

                <div class="row mt-5 g-3">

                <input type="submit" class="btn btn-save w-100" value="Update Product">

                </div>

                <div  class="row mt-5 g-3">

                <button type="reset" class="btn btn-save w-100">

                Reset

                </button>


                </div>

            <!-- </form> -->

        </div>

    </div>
    </form>
</div>

</div>

{% endblock %}
